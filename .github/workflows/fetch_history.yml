
name: Fetch ComTrade History 2020-2024

on:
  workflow_dispatch:   # manual trigger only — one-time run

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch historical data
        env:
          COMTRADE_PRIMARY_KEY: ${{ secrets.COMTRADE_PRIMARY_KEY }}
        run: python scripts/fetch_history.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fuel-imports/
          git diff --staged --quiet || (git commit -m "data: add comtrade_history.csv 2020-2024" && git push)
