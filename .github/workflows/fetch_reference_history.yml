name: Fetch Reference Prices History

on:
  workflow_dispatch:   # manual trigger only — one-time backfill

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Pink Sheet history from Jan 2026
        env:
          START_PERIOD: "202601"
        run: python scripts/fetch_reference_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reference/
          git diff --staged --quiet || (git commit -m "data: backfill market_prices.csv 2026-01 to present" && git push)
