name: Monthly Reference Price Update

on:
  schedule:
    - cron: '0 6 15 * *'   # 15th of each month, 06:00 UTC
  workflow_dispatch:         # manual trigger via GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Pink Sheet benchmark prices
        run: python scripts/fetch_reference_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reference/
          git diff --staged --quiet || (git commit -m "data: update market_prices.csv $(date -u +%Y-%m-%d)" && git push)
