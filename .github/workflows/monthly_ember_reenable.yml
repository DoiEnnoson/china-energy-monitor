name: Ember Monthly Re-Enable

on:
  schedule:
    # 05:00 UTC on the 1st of every month — runs before the update workflow
    # starts on the 17th, so there is no race condition.
    - cron: '0 5 1 * *'
  workflow_dispatch:   # manual trigger if needed

jobs:
  reenable:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Re-enable Ember monthly update workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow enable monthly_ember_update.yml
