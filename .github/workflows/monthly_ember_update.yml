name: Ember Monthly Update

on:
  schedule:
    # 06:00 UTC, days 17-31 of every month.
    # Disabled automatically after a successful update (see last step).
    # Re-enabled on the 1st by monthly_ember_reenable.yml.
    - cron: '0 6 17-31 * *'
  workflow_dispatch:   # manual trigger for testing

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # needed to disable this workflow after success

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Check and fetch Ember data
        id: ember
        env:
          EMBER_KEY: ${{ secrets.EMBER_KEY }}
        run: python scripts/fetch_ember_monthly.py

      - name: Commit and push if updated
        if: steps.ember.outputs.new_data == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/power/
          git commit -m "data: ember_power + ember_capacity ${{ steps.ember.outputs.new_period }} (auto)"
          git push

      - name: Disable this workflow until next month
        if: steps.ember.outputs.new_data == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow disable monthly_ember_update.yml

      - name: Trigger Total Energy System rebuild
        if: steps.ember.outputs.new_data == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build_supply.yml
